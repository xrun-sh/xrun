<!doctype html>
<html lang="%%LANG%%">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>%%TITLE%% · xrun</title>
  <style>
%%TOKENS%%
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      color: var(--text); background: var(--sidebar); }
    main { width: min(400px, 100%); padding: 28px 28px 22px; background: var(--card);
      border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--menu-shadow); }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .brand svg { display: block; width: 72px; height: auto; }
    .brand g[fill] { fill: currentColor; }
    .provider { font-size: 12px; color: var(--muted); padding: 1px 9px; border: 1px solid var(--border);
      border-radius: 999px; }
    .status { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
      margin-bottom: 16px; color: var(--accent); background: var(--soft); }
    [data-state="declined"] .status { color: var(--danger); background: var(--danger-bg); }
    [data-state="invalid"] .status { color: var(--warning); background: var(--warning-bg); }
    [data-state="finished"] .status { color: var(--muted); background: var(--surface); }
    .status svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 20px; line-height: 1.4; font-weight: 600; margin: 0 0 4px; }
    p { margin: 0; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
    details { margin-top: 18px; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); }
    summary { cursor: pointer; width: fit-content; display: flex; align-items: center; gap: 7px; list-style: none;
      color: var(--muted); font-size: 12.5px; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: ""; width: 5px; height: 5px; margin: 0 2px 0 1px; border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform 0.15s; }
    details[open] > summary::before { transform: rotate(45deg); }
    summary:hover { color: var(--text); }
    summary:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; border-radius: 4px; }
    pre { margin: 8px 0 2px; font: 12px/1.6 var(--font-mono); color: var(--text); white-space: pre-wrap;
      overflow-wrap: anywhere; max-height: 200px; overflow: auto; }
    footer { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 12px;
      color: var(--faint); }
    @media (max-width: 380px) { body { padding: 16px; } main { padding: 24px 20px 18px; } }
  </style>
  <script>history.replaceState(null, '', '/')</script>
</head>
<body>
  <main data-state="%%STATE%%">
    <header><span class="brand">%%BRAND%%</span><span class="provider">Cloudflare</span></header>
    <div class="status" aria-hidden="true"><svg viewBox="0 0 24 24">%%ICON%%</svg></div>
    <h1>%%TITLE%%</h1>
    <p>%%MESSAGE%%</p>
    %%DETAILS%%
    <footer>%%FOOTER%%</footer>
  </main>
</body>
</html>
